# 自动部署：push 到 main 后通过 wrangler-action 部署到 Cloudflare Workers
# 部署配置；CLOUDFLARE_API_TOKEN 需在仓库 Secrets 中配置
name: Deploy Worker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
